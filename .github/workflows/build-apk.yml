name: Crea APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Installa NDK e CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null

      - name: Scarica il motore AI (llama.cpp)
        run: git clone --depth 1 --branch b4600 https://github.com/ggml-org/llama.cpp app/src/main/cpp/llama.cpp

      - name: Compila
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rinomina APK
        run: cp app/build/outputs/apk/release/app-release.apk StorieItalia.apk

      - uses: actions/upload-artifact@v4
        with:
          name: StorieItalia-apk
          path: StorieItalia.apk

      - name: Pubblica nelle Release (link diretto per il telefono)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Storie d'Italia v1.${{ github.run_number }}
          body: Scarica StorieItalia.apk qui sotto e installalo sul telefono.
          files: StorieItalia.apk
