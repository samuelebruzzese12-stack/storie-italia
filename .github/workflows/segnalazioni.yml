# Tiene attivo il progetto Supabase gratuito delle segnalazioni (si mette in pausa dopo 7 giorni senza attività)
# e controlla che la chiave pubblica dell'app non possa leggere le segnalazioni.
name: Segnalazioni attive

on:
  schedule:
    - cron: "23 6 */3 * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/segnalazioni.yml"]

env:
  URL: https://ijogkdiggezblepsmfzg.supabase.co
  # chiave pubblicabile: la stessa dell'app, permette solo di inviare segnalazioni
  KEY: sb_publishable_DWX_YylLyD8PFidbN5ZIBw_UwYqz8Gr

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Tieni attivo il progetto
        run: |
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
          echo
      - name: La chiave non deve poter leggere le segnalazioni
        if: github.event_name == 'push'
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/segnalazioni?select=id&limit=1" -H "apikey: $KEY")
          echo "lettura con la chiave pubblica: HTTP $code"
          test "$code" = "401" -o "$code" = "403"
