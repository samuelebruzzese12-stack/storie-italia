plugins {
    id 'com.android.application'
}

android {
    namespace 'it.storieitalia.app'
    compileSdk 34
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'it.storieitalia.app'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'

        ndk {
            // AI ottimizzata per telefoni a 64 bit (praticamente tutti dal 2017 in poi)
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
                cppFlags '-std=c++17'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // firmata con la chiave di debug: basta per installarla sul proprio telefono
            signingConfig signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packagingOptions {
        jniLibs { useLegacyPackaging true }
    }
}
